rule_files:
  - slo.rules.yaml

evaluation_interval: 1m

tests:
  # Test 1: Availability outage pages, but normal traffic or short blips do not page
  - interval: 1m
    input_series:
      - series: 'lab_http_requests_total{route="/predict", code="200"}'
        # 100 req/min for 30 minutes, then 0 (outage)
        values: '0+100x30 3000+0x30'
      - series: 'lab_http_requests_total{route="/predict", code="500"}'
        # Normal until minute 30, then 100 errors/min
        values: '0+0x30 0+100x30'

    alert_rule_test:
      # Normal traffic: no alert
      - eval_time: 15m
        alertname: PredictAvailabilityBurnRateHigh
        exp_alerts: []

      # Brief outage starts at 30m, but `for: 2m` holds alert until 33m
      - eval_time: 31m
        alertname: PredictAvailabilityBurnRateHigh
        exp_alerts: []

      # Outage persists: alert fires at 35m
      - eval_time: 35m
        alertname: PredictAvailabilityBurnRateHigh
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "/predict availability burn rate is dangerously high"
              description: "High error rate on /predict is rapidly consuming the 99.1% availability error budget."

  # Test 2: Model fallback ratio alert fires during prolonged model outage
  - interval: 1m
    input_series:
      - series: 'lab_predictions_total{source="model"}'
        values: '0+100x30 3000+0x30'
      - series: 'lab_predictions_total{source="fallback"}'
        # Serving crashes at minute 30: 100% fallback
        values: '0+0x30 0+100x30'

    alert_rule_test:
      - eval_time: 15m
        alertname: ModelServingFallbackHigh
        exp_alerts: []

      - eval_time: 36m
        alertname: ModelServingFallbackHigh
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "Predictions are overwhelmingly using static fallback instead of ML model"
              description: "Fallback rate exceeds the 4% error budget over the 1h and 5m observation windows."
