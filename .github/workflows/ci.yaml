# CI/CD for the NYC Taxi App (S0).
# Pushes to main: run make check, build arm64 image to GHCR, and deploy on self-hosted runner.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - name: Run static checks and unit tests
        run: make check

  image:
    needs: check
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.img.outputs.tag }}
      prefix: ${{ steps.img.outputs.prefix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Image name and tag
        id: img
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: app
          platforms: linux/arm64
          push: true
          tags: ${{ steps.img.outputs.prefix }}/app:${{ steps.img.outputs.tag }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  deploy:
    needs: image
    runs-on: [self-hosted, lab-app]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy app stack via Compose
        run: |
          export IMAGE_PREFIX="${{ needs.image.outputs.prefix }}"
          export IMAGE_TAG="${{ needs.image.outputs.tag }}"
          docker compose -f deploy/compose.app.yaml pull
          docker compose -f deploy/compose.app.yaml up -d --wait
      - name: Smoke test /version endpoint
        run: |
          for _ in $(seq 1 15); do
            response=$(curl -fsS http://localhost/version || true)
            if [[ -n "$response" ]]; then
              echo "Smoke test passed: $response"
              exit 0
            fi
            sleep 2
          done
          echo "Smoke test failed to reach /version" >&2
          exit 1
