# CD: blue-green deployment on the app host (S3).
# Deploys the new image tag to the idle colour (deploy/compose.web.yaml), smoke tests it,
# and switches traffic with deploy/web.sh switch. The previous colour remains running for rollback.
name: cd

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "deploy or rollback"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - rollback
      tag:
        description: "Image tag to deploy (default sha-<first 7 of commit>)"
        required: false

permissions:
  contents: read
  packages: read

concurrency:
  group: cd-app
  cancel-in-progress: false

jobs:
  deploy-app:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, lab-app]
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      TAG: ${{ inputs.tag }}
      ACTION: ${{ inputs.action || 'deploy' }}
      LLM_HOST: ${{ vars.LLM_HOST }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SHA }}
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy or Rollback
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          deploy/web.sh prepare

          if [[ "$ACTION" == "rollback" ]]; then
            echo "Executing rollback (switching colours without deploying)..."
            LIVE=$(deploy/web.sh live)
            echo "Currently live colour: $LIVE"
            if [[ "$LIVE" == "blue" ]]; then
              TARGET="green"
            elif [[ "$LIVE" == "green" ]]; then
              TARGET="blue"
            else
              echo "Cannot roll back: no colour is currently marked live ($LIVE)" >&2
              exit 1
            fi
            echo "Rolling back traffic to $TARGET..."
            start_ts=$(date +%s%N)
            deploy/web.sh smoke "$TARGET"
            deploy/web.sh switch "$TARGET"
            end_ts=$(date +%s%N)
            elapsed_ms=$(( (end_ts - start_ts) / 1000000 ))
            echo "Rollback to $TARGET completed in ${elapsed_ms}ms"
            deploy/web.sh status
            exit 0
          fi

          LIVE=$(deploy/web.sh live)
          echo "Currently live colour: $LIVE"
          if [[ "$LIVE" == "blue" ]]; then
            TARGET="green"
          else
            TARGET="blue"
          fi
          echo "Target idle colour: $TARGET"

          IMAGE_TAG="${TAG:-sha-${SHA::7}}"
          CURRENT_BLUE=$(deploy/web.sh tag blue)
          CURRENT_GREEN=$(deploy/web.sh tag green)

          if [[ "$TARGET" == "blue" ]]; then
            export BLUE_TAG="$IMAGE_TAG"
            export GREEN_TAG="${CURRENT_GREEN:-none}"
            if [[ "$GREEN_TAG" == "none" || -z "$GREEN_TAG" ]]; then
              export GREEN_TAG="$IMAGE_TAG"
            fi
          else
            export GREEN_TAG="$IMAGE_TAG"
            export BLUE_TAG="${CURRENT_BLUE:-none}"
            if [[ "$BLUE_TAG" == "none" || -z "$BLUE_TAG" ]]; then
              export BLUE_TAG="$IMAGE_TAG"
            fi
          fi

          echo "Deploying with: BLUE_TAG=$BLUE_TAG, GREEN_TAG=$GREEN_TAG"
          docker compose -f deploy/compose.web.yaml pull
          docker compose -f deploy/compose.web.yaml up -d --wait --remove-orphans

          echo "Running smoke test on idle colour $TARGET..."
          deploy/web.sh smoke "$TARGET" "$SHA"

          echo "Switching live traffic to $TARGET..."
          deploy/web.sh switch "$TARGET"

      - name: Status check
        run: |
          deploy/web.sh status
